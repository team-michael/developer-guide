        totalCount:
          type: integer
          description: 지정된 기간 동안 해당 메트릭이 누적된 총 횟수
        totalSum:
          type: number
          description: 지정된 기간 동안 해당 메트릭의 총 합계 (sales_conversion인 경우)
        dailyCounts:
          type: array
          items:
            type: object
            properties:
              date:
                type: string
                description: 집계 날짜 (yyyy-MM-dd 형식, KST 기준)
              count:
                type: integer
                description: 해당 날짜에 발생한 메트릭 횟수
              dimensionCounts:
                type: array
                items:
                  type: object
                  properties:
                    dimensionKey:
                      type: string
                      description: 사용자 속성 키
                    dimensionValue:
                      type: string
                      description: 사용자 속성 값
                    count:
                      type: integer
                      description: 해당 속성 값에 대한 메트릭 횟수
          description: 일별로 집계된 메트릭 데이터
        dailySums:
          type: array
          items:
            type: object
            properties:
              date:
                type: string
                description: 집계 날짜 (yyyy-MM-dd 형식, KST 기준)
              sum:
                type: number
                description: 해당 날짜의 합계
              dimensionSums:
                type: array
                items:
                  type: object
                  properties:
                    dimensionKey:
                      type: string
                      description: 사용자 속성 키
                    dimensionValue:
                      type: string
                      description: 사용자 속성 값
                    sum:
                      type: number
                      description: 해당 속성 값에 대한 합계
          description: 일별로 집계된 메트릭 데이터 (sales_conversion인 경우)

    CampaignEventData:
      type: object
      properties:
        id:
