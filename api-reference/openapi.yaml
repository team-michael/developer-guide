openapi: 3.0.3
info:
  title: Notifly API
  version: 1.0.0
  contact:
    email: contact@notifly.tech
servers:
  - url: https://api.notifly.tech
    description: Notifly API 서버입니다
paths:
  /authenticate:
    post:
      summary: Authentication
      operationId: authenticate
      x-mint:
        metadata:
          title: "API 인증 토큰 발급하기"
          description: "Access Key와 Secret Key를 사용하여 1시간 유효한 인증 토큰을 발급받습니다. 모든 API 요청 시 Authorization 헤더에 포함해주시기 바랍니다. 과도한 호출을 방지하기 위해 1시간 이내의 재호출은 기존 토큰을 재활용하는 것을 권장합니다."
          og:title: "Notifly 인증 API"
          og:description: "안전하고 빠르게 API 인증 토큰 발급하기"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - accessKey
                - secretKey
              properties:
                accessKey:
                  type: string
                  description: Notifly 프로젝트 설정 페이지에서 확인하실 수 있습니다. 각 프로젝트별로 1개의 Access Key가 존재합니다.
                  example: example1234567890abcdef1234567890ab
                secretKey:
                  type: string
                  description: Notifly 프로젝트 설정 페이지에서 확인하실 수 있습니다. 각 프로젝트별로 1개의 Secret Key가 존재합니다.
                  example: EXAMPLEabc9%
      responses:
        '200':
          description: 성공적인 인증입니다
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: 클라이언트 오류입니다 (잘못된 요청, 인증 실패 등)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: 서버 내부 오류입니다
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /track-event:
    post:
      summary: Track Event
      operationId: trackEvent
      security:
        - bearerAuth: []
      x-mint:
        metadata:
          title: "이벤트 트래킹"
          description: "사용자 행동 이벤트나 전역 이벤트를 Notifly 엔진으로 전송합니다. 수집된 이벤트 데이터는 캠페인 트리거, 세그먼트 설정, 메시지 개인화 등에 사용됩니다."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
                required:
                  - projectID
                  - eventName
                  - userID
                properties:
                  projectID:
                    type: string
                    description: Notifly 팀에서 제공하는 프로젝트 ID입니다. 문의 - contact@notifly.tech
                  eventName:
                    type: string
                    description: 이벤트 이름
                  eventParams:
                    type: object
                    description: 이벤트와 관련된 추가 파라미터
                  segmentationEventParamKeys:
                    type: array
                    items:
                      type: string
                    description: 세그먼트 분류 시 특별 처리되는 파라미터 키 목록 (최대 1개만 허용)
                  userID:
                    type: string
                    description: 사용자 식별자
            example:
              - projectID: "example_project_1234567890abcdef"
                eventName: "product_view"
                eventParams:
                  product_id: "SH-12345"
                  product_name: "라코스테 폴로 셔츠"
                  brand: "라코스테"
                  category: "셔츠"
                  price: 89000
                  discount_rate: 30
                segmentationEventParamKeys:
                  - brand
                userID: "user_abc123"
      responses:
        '200':
          description: 성공적인 이벤트 전송입니다
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    description: 성공 메시지
              example:
                message: "Successfully tracked events 3 events"
        '400':
          description: 요청 본문 형식 오류입니다
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 인증 실패입니다 (만료 또는 잘못된 토큰)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: 서버 내부 오류입니다
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /set-user-properties:
    post:
      summary: Set User Properties
      operationId: setUserProperties
      security:
        - bearerAuth: []
      x-mint:
        metadata:
          title: "사용자 속성 설정"
          description: "사용자 속성을 Notifly 엔진에 등록하거나 업데이트합니다. 등록된 속성은 세그먼트 분류 및 개인화 메시지에 활용됩니다."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/UserPropertySingle'
              description: 사용자 배열 (최대 1,000명)
            example:
              - projectID: "example_project_1234567890abcdef"
                userID: "user_abc123"
                userProperties:
                  $email: "user@example.com"
                  $phone_number: "01012345678"
                  hobby: "coding"
                  age: 30
                  gender: "Male"
      responses:
        '200':
          description: 성공적인 속성 업데이트입니다
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: integer
                    description: 업데이트된 행 수
              example:
                data: 3
        '400':
          description: 요청 본문 형식 오류입니다
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 인증 실패입니다 (만료 또는 잘못된 토큰)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: 요청 크기 초과입니다 (1,000명 이상 요청)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: 서버 내부 오류입니다
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /users:
    delete:
      summary: Delete Users
      operationId: deleteUsers
      security:
        - bearerAuth: []
      x-mint:
        metadata:
          title: "사용자 삭제"
          description: "Notifly에 등록된 사용자를 삭제합니다. 사용자 ID, 이메일, 전화번호 중 하나를 기준으로 단일 또는 다중 삭제를 지원합니다."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/UserDeleteSingle'
              description: 사용자 배열 (최대 1,000명)
            example:
              - projectID: "example_project_1234567890abcdef"
                userID: "user_abc123"
              - projectID: "example_project_1234567890abcdef"
                userProperties:
                  $email: "delete@example.com"
      responses:
        '200':
          description: 성공적인 사용자 삭제입니다
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: integer
                    description: 삭제된 행 수
              example:
                data: 5
        '400':
          description: 요청 본문 형식 오류입니다
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 인증 실패입니다 (만료 또는 잘못된 토큰)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: 요청 크기 초과입니다 (1,000명 이상 요청)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: 서버 내부 오류입니다
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /messages/text-message:
    post:
      summary: 문자 메시지 발송
      operationId: sendTextMessage
      security:
        - bearerAuth: []
      x-mint:
        content: |
          <Warning>
            **주의 사항**
            
            - API를 이용한 문자 발송은 **Notifly 문자 자체 발송** 설정이 되어있을 경우에만 가능합니다.
            - 발신 번호는 자체 발송 설정에 입력된 번호가 사용됩니다.
            - 아직 API를 이용한 발송 결과에 대한 통계는 UI로 제공되지 않습니다. 정보가 필요하실 경우 contact@notifly.tech으로 문의해주세요.
          </Warning>
        metadata:
          title: "문자 메시지 발송"
          description: "문자 메시지(SMS, LMS, MMS)를 발송합니다."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - projectId
                - type
                - body
                - recipientList
              properties:
                projectId:
                  type: string
                  description: Notifly 설정 페이지에서 확인 가능
                type:
                  type: string
                  enum:
                    - sms
                    - lms
                    - mms
                  description: 메시지 유형
                title:
                  type: string
                  description: 본문 제목 (lms, mms에만 사용)
                body:
                  type: string
                  description: 본문 내용
                sendNo:
                  type: string
                  description: 여러 발신 번호가 등록되어 있을 경우 발송할 번호
                recipientList:
                  type: array
                  items:
                    type: object
                    required:
                      - recipientNo
                    properties:
                      recipientNo:
                        type: string
                        description: 수신 번호
                  description: 수신자 목록 (최대 1,000명)
            example:
              projectId: "example_project_1234567890abcdef"
              type: "sms"
              body: "Message Body"
              recipientList:
                - recipientNo: "01012345678"
                - recipientNo: "01045671234"
      responses:
        '200':
          description: 성공적인 메시지 발송입니다
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
              example:
                success: true
        '400':
          description: 발신자 정보가 등록되지 않았습니다
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: string
                    nullable: true
                  error:
                    type: string
              example:
                data: null
                error: "Sender info is not registered."
        '500':
          description: 서버 내부 오류입니다
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  error:
                    type: string
              example:
                success: false
                error: "Internal Server Error"

  /messages/kakao-alimtalk:
    post:
      summary: 카카오 알림톡 발송
      operationId: sendKakaoAlimtalk
      security:
        - bearerAuth: []
      x-mint:
        content: |
          <Warning>
            **주의 사항**
            
            API를 이용한 발송 결과에 대한 통계는 별도 페이지를 통해 제공하고 있습니다. 정보가 필요하실 경우 contact@notifly.tech으로 문의해주세요.
          </Warning>
        metadata:
          title: "카카오 알림톡 발송"
          description: "알림톡 템플릿 코드와 수신자 리스트를 사용하여 카카오 알림톡 메시지를 발송합니다."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - projectId
                - templateId
                - recipientList
              properties:
                projectId:
                  type: string
                  description: Notifly 설정 페이지에서 확인 가능
                templateId:
                  type: string
                  description: 등록한 발송 템플릿 ID (알림톡 템플릿 리스트에서 확인 가능)
                channelId:
                  type: string
                  description: 발송할 카카오 채널 ID
                resendSendNo:
                  type: string
                  description: 대체 발송 발신 번호 (Notifly 문자 자체 발송이 설정된 번호)
                senderGroupingKey:
                  type: string
                  description: 발신 그룹핑 키 (최대 100자)
                recipientList:
                  type: array
                  items:
                    type: object
                    required:
                      - recipientNo
                    properties:
                      recipientNo:
                        type: string
                        description: 수신 번호 (최대 15자)
                      templateParameter:
                        type: object
                        description: 템플릿 파라미터, 치환할 변수가 포함된 경우 필수
                      resendParameter:
                        type: object
                        description: 대체 발송 정보
                        properties:
                          isResend:
                            type: boolean
                            description: 발송 실패 시 문자 대체 발송 여부 (기본값 false)
                          resendType:
                            type: string
                            enum:
                              - SMS
                              - LMS
                            description: 대체 발송 타입. 템플릿 본문 길이에 따라 타입이 구분됩니다.
                          resendTitle:
                            type: string
                            description: LMS 대체 발송 제목 (기본값은 플러스친구 ID)
                          resendContent:
                            type: string
                            description: 대체 발송 내용 (기본값은 메시지 본문과 웹링크 버튼명 - 웹링크 Mobile 링크)
                  description: 수신자 목록 (최대 1,000명)
            example:
              projectId: "example_project_1234567890abcdef"
              templateId: "template-id"
              recipientList:
                - recipientNo: "01012345678"
                  templateParameter:
                    user_name: "Notifly User"
                - recipientNo: "01056781234"
                  templateParameter:
                    user_name: "Notifly Customer"
      responses:
        '200':
          description: 성공적인 메시지 발송입니다
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
              example:
                success: true
        '413':
          description: 발신자 정보가 등록되지 않았습니다
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: string
                    nullable: true
                  error:
                    type: string
              example:
                data: null
                error: "Sender info is not registered."
        '500':
          description: 서버 내부 오류입니다
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  error:
                    type: string
              examples:
                internal_error:
                  value:
                    success: false
                    error: "Internal Server Error"
                resend_sender_not_registered:
                  value:
                    success: false
                    error: "The sender information for resending text message has not been registered. Please register it in the Notifly console first."

  /messages/kakao-friendtalk:
    post:
      summary: 카카오 친구톡 발송
      operationId: sendKakaoFriendtalk
      security:
        - bearerAuth: []
      x-mint:
        content: |
          <Warning>
            **주의 사항**
            
            - HTTP REST API를 이용한 카카오 친구톡 발송은 **Notifly 카카오톡 자체 발송** 설정이 되어있을 경우에만 가능합니다.
            - 아직 API를 이용한 발송 결과에 대한 통계는 UI로 제공되지 않습니다. 정보가 필요하실 경우 contact@notifly.tech으로 문의해주세요.
          </Warning>
        metadata:
          title: "카카오 친구톡 발송"
          description: "카카오 친구톡 메시지를 발송합니다. 프렌드톡 메시지는 수신자 목록, 광고 여부, 메시지 유형 등을 설정하여 전송합니다."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - projectId
                - messageType
                - recipientList
              properties:
                projectId:
                  type: string
                  description: Notifly 설정 페이지에서 확인 가능
                channelId:
                  type: string
                  description: 여러 카카오 채널이 등록되어 있을 경우 발송할 채널 ID
                messageType:
                  type: string
                  enum:
                    - text
                  description: 메시지 타입 (현재 text 타입만 지원)
                isAd:
                  type: boolean
                  description: 광고 여부
                recipientList:
                  type: array
                  items:
                    type: object
                    required:
                      - recipientNo
                      - content
                    properties:
                      recipientNo:
                        type: string
                        description: 수신 번호
                      content:
                        type: object
                        required:
                          - text
                        properties:
                          text:
                            type: string
                            description: 본문 내용
                  description: 수신자 목록 (최대 1,000명)
            example:
              projectId: "example_project_1234567890abcdef"
              messageType: "text"
              isAd: false
              recipientList:
                - recipientNo: "01012345678"
                  content:
                    text: "test"
      responses:
        '200':
          description: 성공적인 메시지 발송입니다
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
              example:
                success: true
        '413':
          description: 발신자 정보가 등록되지 않았습니다
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: string
                    nullable: true
                  error:
                    type: string
              example:
                data: null
                error: "Sender info is not registered."
        '500':
          description: 서버 내부 오류입니다
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  error:
                    type: string
              example:
                success: false
                error: "Internal Server Error"

  /projects/{projectId}/messages/kakao-alimtalk/templates:
    get:
      summary: 알림톡 템플릿 리스트 조회
      operationId: listKakaoAlimtalkTemplates
      security:
        - bearerAuth: []
      x-mint:
        metadata:
          title: "알림톡 템플릿 리스트 조회"
          description: "등록된 카카오 알림톡 템플릿 목록을 조회합니다."
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
          description: 프로젝트 ID
        - name: channelId
          in: query
          required: false
          schema:
            type: string
          description: 알림톡 채널 ID. 등록된 채널이 여러개일 경우 사용됩니다.
        - name: templateCode
          in: query
          required: false
          schema:
            type: string
          description: 템플릿 코드
        - name: templateName
          in: query
          required: false
          schema:
            type: string
          description: 템플릿 이름
        - name: templateStatus
          in: query
          required: false
          schema:
            type: string
          description: 템플릿 상태 코드
        - name: pageNum
          in: query
          required: false
          schema:
            type: integer
            default: 1
          description: 페이지 번호
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            default: 15
            maximum: 1000
          description: 조회 건수
      responses:
        '200':
          description: 성공적인 템플릿 리스트 조회입니다
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KakaoTemplateListResponse'
        '400':
