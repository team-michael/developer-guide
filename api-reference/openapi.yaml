            </Tab>
            
            <Tab title="in-app-message">
              ```json
              {
                "templateName": "템플릿 이름"
              }
              ```
            </Tab>
            
            <Tab title="in-web-message">
              ```json
              {
                "templateName": "템플릿 이름"
              }
              ```
            </Tab>
            
            <Tab title="web-push-notification">
              ```json
              {
                "notifly": {
                  "ti": "제목",
