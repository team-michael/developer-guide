components:
  schemas:
    UserPropertySingle:
      type: object
      required:
        - projectID
        - userProperties
        - userID
      properties:
        projectID:
          type: string
          description: Notifly 팀에서 제공하는 프로젝트 ID입니다. 문의 - contact@notifly.tech
        userProperties:
          type: object
          description: 사용자 속성(key-value)
        userID:
          type: string
          description: 사용자 식별자
      example:
        projectID: "example_project_1234567890abcdef"
        userID: "user_abc123"
        userProperties:
          $email: "user@example.com"
          $phone_number: "01012345678"
          hobby: "coding"
          age: 30
          gender: "Male"

    UserDeleteSingle:
      type: object
      required:
        - projectID
      properties:
        projectID:
          type: string
          description: Notifly 팀에서 제공하는 프로젝트 ID입니다. 문의 - contact@notifly.tech
        userID:
          type: string
          description: 삭제할 사용자의 ID
        userProperties:
          type: object
          description: 삭제할 사용자 속성 (이메일, 전화번호 기반 삭제 지원)
          properties:
            $email:
              type: string
              description: 삭제할 사용자의 이메일 주소
            $phone_number:
              type: string
              description: 삭제할 사용자의 전화번호
      example:
        projectID: "example_project_1234567890abcdef"
        userID: "user_abc123"

    SuccessResponse:
      type: object
      properties:
        data:
          type: string
          description: 인증 토큰 값입니다 (1시간 유효)
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.example
        error:
          type: string
          nullable: true
          description: 성공 시 null입니다
          example: null

    ErrorResponse:
      type: object
      properties:
        data:
          type: string
          nullable: true
          description: 오류 시 null
          example: null
        error:
          type: string
          description: 에러 메시지
        projectId:
          type: string
          nullable: true
          description: 프로젝트 ID (500 오류 시에만 포함)
          example: null
        durationMs:
          type: integer
          nullable: true
          description: 처리 시간(ms) (500 오류 시에만 포함)
          example: null

    SimpleErrorResponse:
      type: object
      properties:
        error:
          type: string
          description: 에러 메시지
      example:
        error: "some-error-message"

    KakaoTemplateResponse:
      type: object
      properties:
        resultCode:
          type: integer
          description: 결과 코드
        resultMessage:
          type: string
          description: 결과 메시지
      example:
        resultCode: 0
        resultMessage: "Success"

    KakaoTemplateListResponse:
      type: object
      properties:
        resultCode:
          type: integer
          description: 결과 코드
        resultMessage:
          type: string
          description: 결과 메시지
        templateListResponse:
          type: object
          properties:
            templates:
              type: array
              items:
                type: object
              description: 템플릿 목록
            totalCount:
              type: integer
              description: 전체 템플릿 수

    KakaoTemplateInput:
      type: object
      required:
        - templateCode
        - templateName
        - templateContent
      properties:
        channelId:
          type: string
          description: 알림톡 채널 ID
        templateCode:
          type: string
          description: 템플릿 코드 (최대 20자, Unique)
        templateName:
          type: string
          description: 템플릿명 (최대 150자)
        templateContent:
          type: string
          description: 템플릿 본문 (최대 1000자)
        templateMessageType:
          type: string
          enum:
            - BA
            - EX
            - AD
            - MI
          description: 템플릿 메시지 유형 (BA-기본형, EX-부가정보형, AD-채널추가형, MI-복합형)
        templateEmphasizeType:
          type: string
          enum:
            - NONE
            - TEXT
            - IMAGE
            - ITEM_LIST
          description: 템플릿 강조 표시 타입
        templateExtra:
          type: string
          description: 템플릿 부가 정보 (EX 또는 MI일 경우 필수)
        templateTitle:
          type: string
          description: 템플릿 제목 (최대 50자)
        templateSubtitle:
          type: string
          description: 템플릿 보조 문구 (최대 50자)
        templateHeader:
          type: string
          description: 템플릿 헤더 (최대 16자)
        templateItem:
          type: object
          description: 아이템 정보
          properties:
            list:
              type: array
              items:
                type: object
                required:
                  - title
                  - description
                properties:
                  title:
                    type: string
                    description: 아이템 타이틀 (최대 6자)
                  description:
                    type: string
                    description: 아이템 디스크립션 (최대 23자)
              description: 아이템 리스트 (최소 2개, 최대 10개)
            summary:
              type: object
              required:
                - title
                - description
              properties:
                title:
                  type: string
                  description: 요약 타이틀 (최대 6자)
                description:
                  type: string
                  description: 요약 디스크립션 (변수 및 화폐 단위, 숫자, 쉼표, 마침표만 사용 가능, 최대 14자)
              description: 아이템 요약 정보
        templateItemHighlight:
          type: object
          description: 아이템 하이라이트
          properties:
            title:
              type: string
              description: 하이라이트 타이틀 (최대 30자, 섬네일 이미지가 있을 경우 21자)
            description:
              type: string
              description: 하이라이트 디스크립션 (최대 19자, 섬네일 이미지가 있을 경우 13자)
            imageUrl:
              type: string
              description: 섬네일 이미지 URL
        templateRepresentLink:
          type: object
          description: 대표 링크
          properties:
            linkMo:
              type: string
              description: 모바일 웹 링크 (최대 500자)
            linkPc:
              type: string
              description: PC 웹 링크 (최대 500자)
            schemeIos:
              type: string
              description: iOS 앱 링크 (최대 500자)
            schemeAndroid:
              type: string
              description: 안드로이드 앱 링크 (최대 500자)
        templateImageName:
          type: string
          description: 이미지명
        templateImageUrl:
          type: string
          description: 이미지 URL
        securityFlag:
          type: boolean
          description: 보안 템플릿 여부
        categoryCode:
          type: string
          description: 템플릿 카테고리 코드 (기본값 999999)
        buttons:
          type: array
          items:
            type: object
            required:
              - ordering
              - type
              - name
            properties:
              ordering:
                type: integer
                description: 버튼 순서 (1~5)
              type:
                type: string
                enum:
                  - WL
                  - AL
                  - DS
                  - BK
                  - MD
                  - BC
                  - BT
                  - AC
                  - BF
                  - P1
