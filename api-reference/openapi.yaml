          </Tabs>
        metadata:
          title: "캠페인 이벤트 데이터 내보내기 결과 조회"
          description: "Export 요청으로 얻은 export_id를 활용해 비동기로 생성된 데이터를 페이지 당 최대 1,000개 단위로 조회합니다."
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
          description: 프로젝트 ID
        - name: exportId
          in: path
          required: true
          schema:
            type: string
          description: Export 요청 시 발급된 ID
        - name: page
          in: query
          required: true
          schema:
            type: integer
            minimum: 0
          description: 0부터 시작하는 페이지 번호 (범위 0 ~ total_page_count - 1)
      responses:
        '200':
          description: 해당 페이지 데이터 조회 성공입니다
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/CampaignEventData'
                  total_page_count:
                    type: integer
              example:
                status: "success"
                data:
                  - id: "E252EB67-48E3-49DC-866D-F8C26161230D"
                    user_id: "user_12345"
                    notifly_user_id: "notifly_user_abcde"
                    device_id: "ios_device_98765"
                    notifly_device_id: "notifly_device_xyz"
                    channel: "push_notification"
                    event_name: "send_success"
                    failure_reason: null
                    resource_title: "6월 신규 혜택 안내"
                    resource_type: "campaign"
                    campaign_id: "camp_202406_promo"
                    experiment_group_name: "A"
                    user_journey_id: null
                    user_journey_node_id: null
                    time: "1749373994000000"
                    message_data:
                      title: "지금 확인하고 혜택 받기!"
                      body: "6월 신규 회원님만을 위한 특별 이벤트 🎁"
                      link: "link://link/feed?id=1243"
                total_page_count: 1
        '202':
          description: 데이터 생성 중입니다
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
              example:
                status: "processing"
                message: "Data is being generated."
        '404':
          description: 존재하지 않는 projectId나 exportId입니다
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
              example:
                status: "not_found"
                message: "The specified project_id and export_id could not be found."
        '408':
          description: 타임아웃입니다
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
              example:
                error: "Timeout"
        '416':
          description: 잘못된 page 요청입니다
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
              example:
                status: "invalid_page"
                message: "The requested page does not exist."
        '500':
          description: 서버 내부 오류입니다
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
              example:
                status: "error"
                message: "An error occurred while processing the data."

components:
  schemas:
    UserPropertySingle:
      type: object
      required:
        - projectID
        - userProperties
        - userID
      properties:
        projectID:
          type: string
          description: Notifly 팀에서 제공하는 프로젝트 ID입니다. 문의 - contact@notifly.tech
        userProperties:
          type: object
          description: 사용자 속성(key-value)
        userID:
          type: string
          description: 사용자 식별자
      example:
        projectID: "example_project_1234567890abcdef"
        userID: "user_abc123"
        userProperties:
          $email: "user@example.com"
          $phone_number: "01012345678"
          hobby: "coding"
          age: 30
          gender: "Male"

    UserDeleteSingle:
      type: object
      required:
        - projectID
      properties:
        projectID:
          type: string
          description: Notifly 팀에서 제공하는 프로젝트 ID입니다. 문의 - contact@notifly.tech
        userID:
          type: string
          description: 삭제할 사용자의 ID
        userProperties:
          type: object
          description: 삭제할 사용자 속성 (이메일, 전화번호 기반 삭제 지원)
          properties:
            $email:
              type: string
              description: 삭제할 사용자의 이메일 주소
            $phone_number:
              type: string
              description: 삭제할 사용자의 전화번호
      example:
        projectID: "example_project_1234567890abcdef"
        userID: "user_abc123"

    SuccessResponse:
      type: object
      properties:
        data:
          type: string
          description: 인증 토큰 값입니다 (1시간 유효)
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.example
        error:
          type: string
          nullable: true
          description: 성공 시 null입니다
          example: null

    ErrorResponse:
      type: object
      properties:
        data:
          type: string
          nullable: true
          description: 오류 시 null
          example: null
        error:
          type: string
          description: 에러 메시지
        projectId:
          type: string
          nullable: true
          description: 프로젝트 ID (500 오류 시에만 포함)
          example: null
        durationMs:
          type: integer
          nullable: true
          description: 처리 시간(ms) (500 오류 시에만 포함)
          example: null

    CampaignStatistics:
      type: object
      properties:
        date:
          type: string
          description: 통계 데이터 날짜 (YYYY-MM-DD 형식)
        resource_type:
          type: string
          enum:
            - campaign
            - user-journey
          description: 리소스 타입
        message:
          type: object
          description: 메시지 내용 (채널별로 상이한 구조)
        campaign_id:
          type: string
          nullable: true
          description: 캠페인 ID (캠페인 리소스인 경우에만 존재)
        campaign_name:
          type: string
          nullable: true
          description: 캠페인 이름 (캠페인 리소스인 경우에만 존재)
        variant_id:
          type: string
          nullable: true
          description: Variant ID (캠페인 리소스이고, A/B 테스트인 경우에만 존재)
        variant_name:
          type: string
          nullable: true
          description: Variant 이름 (캠페인 리소스이고, A/B 테스트인 경우에만 존재)
        tags:
          type: array
          items:
            type: string
          description: 캠페인 태그 목록
        user_journey_id:
          type: string
          nullable: true
          description: 유저 여정 ID (유저 여정 리소스인 경우에만 존재)
        user_journey_name:
          type: string
          nullable: true
          description: 유저 여정 이름 (유저 여정 리소스인 경우에만 존재)
        user_journey_node_id:
          type: string
          nullable: true
          description: 유저 여정 노드 ID (유저 여정 리소스인 경우에만 존재)
        user_journey_node_name:
          type: string
          nullable: true
          description: 유저 여정 노드 이름 (유저 여정 리소스인 경우에만 존재)
        channel:
          type: string
          description: 발송 채널 정보
        message_sent:
          type: integer
          description: 발송 시도된 메시지 수
        message_failed:
          type: integer
          description: 발송 실패한 메시지 수
        delivered:
          type: integer
          nullable: true
          description: 전달 완료된 메시지 수 (채널에서 지원하지 않는 경우 null)
        click:
          type: integer
          nullable: true
          description: 클릭된 메시지 수 (채널에서 지원하지 않는 경우 null)
        conversion:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
                description: 전환 이름
              type:
                type: string
                description: 전환 타입
              count:
                type: integer
                description: 전환 수
          description: 전환 데이터 배열

    CampaignStatsMetric:
      type: object
      properties:
        metricName:
