  /projects/{projectId}/campaigns/{campaignId}/stats:
    get:
      summary: 캠페인 통계 상세 조회
      operationId: getCampaignStatisticsRetrieval
      security:
        - bearerAuth: []
      x-mint:
        content: |
          <Note>
            **조회 조건**
            
            전일 데이터는 매일 오전 7시(KST)에 집계가 완료됩니다. 정확한 전일 데이터 조회를 위해서는 오전 7시 이후에 API를 호출하시기를 권장합니다.
          </Note>
          
          <Note>
            **Campaign Statistics API 변경 사항**
            
            2025-07-06 부터, conversionType 필드가 추가되었습니다.
          </Note>
        metadata:
          title: "캠페인 통계 상세 조회"
          description: "특정 캠페인의 발송 현황을 조회합니다."
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
          description: 프로젝트 ID
        - name: campaignId
          in: path
          required: true
          schema:
            type: string
          description: 캠페인 ID
        - name: start
          in: query
          required: true
          schema:
            type: string
            format: date-time
          description: 조회 시작일자 (yyyy-MM-ddTHH:mm:ss.sssZ 형식, UTC 기준)
          example: "2024-10-27T15:00:00.000Z"
        - name: end
          in: query
          required: true
          schema:
            type: string
            format: date-time
          description: 조회 종료일자 (yyyy-MM-ddTHH:mm:ss.sssZ 형식, UTC 기준)
          example: "2024-10-29T15:00:00.000Z"
      responses:
        '200':
          description: 성공적인 캠페인 통계 조회입니다
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      lastCollectedAt:
                        type: string
                        description: 최종 집계 시간 (yyyy-MM-dd HH:mm:ss 형식, KST 기준)
                      stats:
                        type: array
                        items:
                          $ref: '#/components/schemas/CampaignStatsMetric'
                  error:
                    type: string
                    nullable: true
              example:
                data:
                  lastCollectedAt: "2024-10-29 04:00:00"
                  stats:
                    - metricName: "구매_이벤트"
                      metricType: "conversion"
                      conversionType: "sales_conversion"
                      totalSum: 930832
                      dailySums:
                        - date: "2024-09-30"
                          sum: 0
                          dimensionSums:
                            - dimensionKey: "이름"
                              dimensionValue: "이름1"
                              sum: 0
                    - metricName: "send_success"
                      metricType: "standard"
                      totalCount: 550
                      dailyCounts:
                        - date: "2024-10-28"
                          count: 250
                          dimensionCounts:
                            - dimensionKey: "region"
                              dimensionValue: "us-east"
                              count: 100
                            - dimensionKey: "region"
                              dimensionValue: "us-west"
                              count: 150
                        - date: "2024-10-29"
                          count: 300
                          dimensionCounts:
                            - dimensionKey: "region"
                              dimensionValue: "us-east"
                              count: 200
                            - dimensionKey: "region"
                              dimensionValue: "us-west"
                              count: 100
                error: null
        '400':
          description: 요청 파라미터 오류입니다
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: string
                    nullable: true
                  error:
                    type: string
              example:
                data: null
                error: "Invalid project ID"
        '401':
          description: 인증 실패입니다
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: string
                    nullable: true
                  error:
                    type: string
              example:
                data: null
                error: "Unauthorized: Invalid Authorization Token"
        '500':
          description: 서버 내부 오류입니다
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: string
                    nullable: true
                  error:
                    type: string
              example:
                data: null
                error: "Internal Server Error: some-error-message"

  /projects/{projectId}/campaign-event-data/exports:
    post:
      summary: 캠페인 이벤트 데이터 내보내기 요청
      operationId: createCampaignEventExport
      security:
        - bearerAuth: []
      x-mint:
        content: |
          <Warning>
            **유료 API**
            
            이 요청은 요청 데이터당 과금이 되는 유료 API입니다. 가격은 노티플라이에 문의해주세요.
          </Warning>
        metadata:
          title: "캠페인 이벤트 데이터 내보내기 요청"
          description: "캠페인/유저 여정 이벤트 데이터를 비동기적으로 추출 요청합니다. Response로 받은 export_id를 사용하여 요청 결과를 조회할 수 있습니다."
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
          description: 프로젝트 ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - start
                - end
              properties:
                start:
                  type: string
                  format: date-time
                  description: 조회 시작일자 (yyyy-MM-ddTHH:mm:ss.sssZ, UTC 기준)
                end:
                  type: string
                  format: date-time
                  description: 조회 종료일자 (yyyy-MM-ddTHH:mm:ss.sssZ, UTC 기준, 조회 시작일자로부터 최대 일주일 이내)
                isMessageDataIncluded:
                  type: boolean
                  description: message data 포함 여부 (기본값 false)
            example:
              start: "2025-06-01T00:00:00.000Z"
              end: "2025-06-07T23:59:59.999Z"
              isMessageDataIncluded: true
      responses:
        '200':
          description: Export 요청 성공입니다
          content:
            application/json:
              schema:
                type: object
                properties:
                  export_id:
                    type: string
                    description: Export 작업 ID
              example:
                export_id: "xyz123"
        '400':
          description: 요청 파라미터 오류입니다 (날짜 형식, 범위 오류 등)
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
              example:
                error: "InvalidRequest"
                message: "..."
        '401':
          description: 인증 실패입니다
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
              example:
                error: "Unauthorized"
        '500':
          description: 서버 내부 오류입니다
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
              example:
                error: "InternalServerError"
                message: "..."

  /projects/{projectId}/campaign-event-data/exports/{exportId}/result:
    get:
      summary: 캠페인 이벤트 데이터 내보내기 결과 조회
      operationId: getCampaignEventExportResult
      security:
        - bearerAuth: []
      x-mint:
        content: |
          <Info>
            **페이지네이션 방식**
            
            이 API는 페이지 기반 페이지네이션을 사용합니다:
            - **페이지 번호**: 0부터 시작하는 정수 값
            - **페이지 크기**: 각 페이지당 최대 1,000개의 이벤트 데이터
            - **전체 페이지 수**: `total_page_count` 필드로 제공
            - **유효한 페이지 범위**: 0 ~ (total_page_count - 1)
          </Info>
          
          <Note>
            **Message Data 채널 별 지원 조건**
            
            push-notification을 제외한 다른 채널의 message_data 컬럼은 2025-07-18 이후의 데이터만 지원합니다.
            
            또한, in-app-message와 in-web-message 채널은 아래의 SDK 버전 이후부터 지원됩니다:
            - iOS SDK: 1.17.2
            - Android SDK: 1.18.1
            - React Native SDK: 3.10.1
            - JS SDK: 2.17.4
          </Note>
          
          ### 메시지 데이터 예시
          
          <Tabs>
            <Tab title="text-message">
              ```json
              {
                "requestId": "요청 ID",
                "requestDate": "YYYY-MM-DD HH:mm:ss",
                "templateId": "템플릿 ID",
                "title": "메시지 제목",
                "body": "본문 내용",
                "sendNo": "07000000000",
                "recipientNo": "01012345678",
                "messageType": "MMS",
                "countryCode": "82",
                "adYn": "N",
                "attachFileList": [
                  {
                    "fileId": 123456789,
                    "fileName": "image.jpg",
                    "filePath": "/path/to/image/",
                    "saveFileName": "saved.jpg",
                    "uploadType": "TEMPORARY"
                  }
                ]
              }
              ```
            </Tab>
            
            <Tab title="email">
              ```json
              {
                "title": "메일 제목",
                "body": {
                  "html": "<html><body><p>메일 본문</p></body></html>",
                  "text": "내용"
                }
              }
              ```
            </Tab>
            
            <Tab title="kakao-friendtalk">
              ```json
              {
                "plusFriendId": "@채널명",
                "senderKey": "발신 키",
                "recipientNo": "01012345678",
                "content": "메시지 내용",
                "buttons": [
                  {
